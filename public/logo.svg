<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#F2EDE4" />
    </linearGradient>

    <!-- Terracotta Gradient -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D96E4C" />
      <stop offset="100%" stop-color="#B24F33" />
    </linearGradient>

    <!-- Warm Amber / Gold Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#803D26" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Canvas Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#E3DACD" stroke-width="4" opacity="0.6" />

  <!-- House Roof & Silhouette -->
  <g filter="url(#softShadow)">
    <!-- Roof Chimney -->
    <rect x="330" y="105" width="42" height="75" rx="10" fill="#B24F33" />
    
    <!-- House Main Body (Roof Gable + Lower walls) -->
    <path d="M 256 86 
             L 396 200 
             A 12 12 0 0 1 404 210
             L 404 366 
             A 28 28 0 0 1 376 394 
             L 136 394 
             A 28 28 0 0 1 108 366 
             L 108 210 
             A 12 12 0 0 1 116 200 
             Z" 
          fill="url(#terracottaGrad)" />
  </g>

  <!-- Inner Pantry / Storage Arch Doorway (Muji Cream) -->
  <path d="M 166 394 
           L 166 260 
           A 90 90 0 0 1 346 260 
           L 346 394 
           Z" 
        fill="#FCFAF7" />

  <!-- Shelves inside Pantry Doorway -->
  <line x1="178" y1="295" x2="334" y2="295" stroke="#E5DCCE" stroke-width="6" stroke-linecap="round" />
  <line x1="178" y1="345" x2="334" y2="345" stroke="#E5DCCE" stroke-width="6" stroke-linecap="round" />

  <!-- Dynamic Stock "X" & Checkmark in Center -->
  <!-- Top Left to Bottom Right of X (Amber/Gold) -->
  <path d="M 216 250 L 296 330" stroke="url(#amberGrad)" stroke-width="22" stroke-linecap="round" />
  <!-- Bottom Left to Top Right of X with Check Tail -->
  <path d="M 216 330 L 256 290 L 305 240" stroke="#4D7C5F" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Little Warm Sparkle / Star at top right of house -->
  <circle cx="395" cy="115" r="14" fill="url(#amberGrad)" />
</svg>
